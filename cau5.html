<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Display a random image.</title>
    <style type="text/css">
        body { margin-top: 30px; }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Mảng chứa thông tin các hình ảnh
        var images = [
            { src: "http://farm4.staticflickr.com/3691/11268502654_f28f05966c_m.jpg", width: 240, height: 160 },
            { src: "http://farm1.staticflickr.com/33/45336904_1aef569b30_n.jpg", width: 320, height: 195 },
            { src: "http://farm6.staticflickr.com/5211/5384592886_80a512e2c9.jpg", width: 500, height: 343 }
        ];

        function display_random_image() {
            // Lấy chỉ số ngẫu nhiên từ 0 đến 2
            var randomIndex = Math.floor(Math.random() * images.length);
            var selectedImage = images[randomIndex];

            // Xóa ảnh cũ nếu có
            $('#randomImage').remove();

            // Tạo thẻ img mới và chèn vào body
            var imgTag = $('<img>', {
                id: 'randomImage',
                src: selectedImage.src,
                width: selectedImage.width,
                height: selectedImage.height
            });

            $('body').append(imgTag);
        }
    </script>
</head>
<body>
    <div>
        <button id="jsstyle" onclick="display_random_image()">Show Image</button>
    </div>
</body>
</html>
