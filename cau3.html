<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Insert row in a table - w3resource</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function insert_Row() {
            // Đếm số dòng hiện tại trong bảng để đặt tên cho dòng mới
            var rowCount = $('#sampleTable tr').length + 1;
            
            // Tạo nội dung cho hàng mới
            var newRow = '<tr><td>Row' + rowCount + ' cell1</td><td>Row' + rowCount + ' cell2</td></tr>';
            
            // Thêm hàng mới vào cuối bảng bằng phương thức .append()
            $('#sampleTable').append(newRow);
        }
    </script>
</head>
<body>
    <table id="sampleTable" border="1">
        <tr><td>Row1 cell1</td><td>Row1 cell2</td></tr>
        <tr><td>Row2 cell1</td><td>Row2 cell2</td></tr>
    </table><br>
    <input type="button" onclick="insert_Row()" value="Insert row">
</body>
</html>
