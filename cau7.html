<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển hướng đến đường link</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#linkForm').submit(function(event) {
                event.preventDefault(); // Ngăn submit form mặc định
                
                var url = $('#linkInput').val().trim();
                
                if (url === "") {
                    alert("Vui lòng nhập đường link!");
                    return;
                }

                // Tự động thêm http:// nếu người dùng chưa nhập protocol
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }

                // Hiển thị dialog xác nhận
                var result = confirm("Bạn có muốn chuyển đến trang: " + url + " không?");
                if (result) {
                    window.location.href = url; // Chuyển hướng nếu chọn OK
                }
            });
        });
    </script>
</head>
<body>
    <h1>Nhập đường link và nhấn "Submit" để chuyển hướng:</h1>
    <form id="linkForm">
        <input type="text" id="linkInput" placeholder="Nhập đường link">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
